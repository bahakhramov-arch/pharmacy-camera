plugins {
    id "com.android.application"
}

android {
    namespace "uz.apteka5plus.reports"
    compileSdk 36

    defaultConfig {
        applicationId "uz.apteka5plus.reports"
        minSdk 24
        targetSdk 36
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
